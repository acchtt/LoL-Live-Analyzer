# Standalone frontend preview for pull-request testing.
name = "riftpulse-dashboard-preview"
main = "dashboard-preview-worker.js"
compatibility_date = "2026-07-28"
workers_dev = true
preview_urls = true

[assets]
directory = "./preview-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/__preview-health" ]
