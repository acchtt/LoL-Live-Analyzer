name: Read live feed once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/read-live-feed-once.yml

permissions:
  contents: write

jobs:
  read-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Query deployed Worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          base="https://lol-live-analyzer-api.acchtt.workers.dev"
          curl --retry 3 --retry-delay 2 --fail-with-body -sS "$base/" \
            -o diagnostics/worker-health.json
          curl --retry 3 --retry-delay 2 --fail-with-body -sS \
            "$base/api/chatgpt?gameId=115548681803406193" \
            -D diagnostics/chatgpt-game2.headers.txt \
            -o diagnostics/chatgpt-game2.json
          curl --retry 3 --retry-delay 2 --fail-with-body -sS \
            "$base/api/chatgpt?gameId=115548681803406193&historical=1" \
            -o diagnostics/chatgpt-game2-historical.json
          curl --retry 3 --retry-delay 2 --fail-with-body -sS \
            "$base/api/resolve-game?matchId=115548681803406191" \
            -o diagnostics/mkoi-vit-resolve.json
          python -m json.tool diagnostics/worker-health.json > diagnostics/worker-health.pretty.json
          python -m json.tool diagnostics/chatgpt-game2.json > diagnostics/chatgpt-game2.pretty.json
          python -m json.tool diagnostics/chatgpt-game2-historical.json > diagnostics/chatgpt-game2-historical.pretty.json
          python -m json.tool diagnostics/mkoi-vit-resolve.json > diagnostics/mkoi-vit-resolve.pretty.json

      - name: Commit diagnostic response
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/
          git commit -m "Record one-time live feed diagnostic [skip ci]"
          git push
