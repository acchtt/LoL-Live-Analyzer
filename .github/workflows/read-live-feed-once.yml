name: Read live feed once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/read-live-feed-once.yml

permissions:
  contents: write

jobs:
  read-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify Worker v2.0 completed series after schedule mapping
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          base="https://lol-live-analyzer-api.acchtt.workers.dev"

          sleep 30
          for attempt in $(seq 1 30); do
            curl --retry 2 --retry-delay 1 --fail-with-body -sS "$base/" \
              -o diagnostics/worker-health.json
            version=$(python -c "import json; print(json.load(open('diagnostics/worker-health.json')).get('version',''))")
            if [ "$version" = "2.0" ]; then
              break
            fi
            sleep 4
          done

          python -c "import json; v=json.load(open('diagnostics/worker-health.json')).get('version'); assert v == '2.0', f'Expected Worker 2.0, got {v}'"

          token="final-$(date +%s)"
          curl --retry 5 --retry-delay 3 --fail-with-body -sS \
            "$base/api/chatgpt/115548681803406194/$token" \
            -o diagnostics/v20-final-feed.json
          curl --retry 5 --retry-delay 3 --fail-with-body -sS \
            "$base/api/resolve-game?matchId=115548681803406191" \
            -o diagnostics/v20-final-resolver.json
          curl --retry 5 --retry-delay 3 --fail-with-body -sS \
            "$base/api/schedule" \
            -o diagnostics/v20-final-schedule.json

          python -m json.tool diagnostics/v20-final-feed.json > diagnostics/v20-final-feed.pretty.json
          python -m json.tool diagnostics/v20-final-resolver.json > diagnostics/v20-final-resolver.pretty.json
          python - <<'PY'
          import json
          from pathlib import Path

          match_id = '115548681803406191'
          feed = json.load(open('diagnostics/v20-final-feed.json'))
          resolver = json.load(open('diagnostics/v20-final-resolver.json'))
          schedule = json.load(open('diagnostics/v20-final-schedule.json'))
          events = schedule.get('data', {}).get('schedule', {}).get('events', []) or schedule.get('schedule', {}).get('events', [])
          event = next((e for e in events if str(e.get('match', {}).get('id') or e.get('id')) == match_id), {})

          def teams(rows):
              return [
                  {
                      'code': team.get('code'),
                      'wins': team.get('wins', team.get('result', {}).get('gameWins')),
                      'outcome': team.get('result', {}).get('outcome')
                  }
                  for team in rows or []
              ]

          summary = {
              'workerVersion': json.load(open('diagnostics/worker-health.json')).get('version'),
              'feed': {
                  'schemaVersion': feed.get('schemaVersion'),
                  'matchState': feed.get('match', {}).get('state'),
                  'live': feed.get('source', {}).get('live'),
                  'series': teams(feed.get('series', {}).get('teams')),
                  'result': feed.get('result'),
                  'message': feed.get('message')
              },
              'resolver': {
                  'selectedGame': resolver.get('selectedGame'),
                  'selectedPhase': resolver.get('selectedPhase'),
                  'series': teams(resolver.get('series', {}).get('teams')),
                  'result': resolver.get('result')
              },
              'schedule': {
                  'state': event.get('state'),
                  'series': teams(event.get('match', {}).get('teams')),
                  'scoreSource': event.get('scoreSource')
              }
          }
          Path('diagnostics/v20-final-verification.json').write_text(json.dumps(summary, indent=2) + '\n')
          PY

      - name: Commit diagnostic response
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/
          git commit -m "Reverify Worker v2.0 final series [skip ci]"
          git push
