name: Read live feed once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/read-live-feed-once.yml

permissions:
  contents: write

jobs:
  read-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Wait for Worker v1.7 and query feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          base="https://lol-live-analyzer-api.acchtt.workers.dev"

          for attempt in $(seq 1 30); do
            curl --retry 2 --retry-delay 1 --fail-with-body -sS "$base/" \
              -o diagnostics/worker-health.json
            version=$(python -c "import json; print(json.load(open('diagnostics/worker-health.json')).get('version',''))")
            if [ "$version" = "1.7" ]; then
              break
            fi
            sleep 4
          done

          python -c "import json; v=json.load(open('diagnostics/worker-health.json')).get('version'); assert v == '1.7', f'Expected Worker 1.7, got {v}'"

          curl --retry 3 --retry-delay 2 --fail-with-body -sS \
            "$base/api/chatgpt?gameId=115548681803406194" \
            -D diagnostics/chatgpt-game3.headers.txt \
            -o diagnostics/chatgpt-game3.json
          curl --retry 3 --retry-delay 2 --fail-with-body -sS \
            "$base/api/resolve-game?matchId=115548681803406191" \
            -o diagnostics/mkoi-vit-resolve.json
          curl --retry 3 --retry-delay 2 --fail-with-body -sS \
            "$base/api/schedule" \
            -o diagnostics/schedule-v17.json

          python -m json.tool diagnostics/worker-health.json > diagnostics/worker-health.pretty.json
          python -m json.tool diagnostics/chatgpt-game3.json > diagnostics/chatgpt-game3.pretty.json
          python -m json.tool diagnostics/mkoi-vit-resolve.json > diagnostics/mkoi-vit-resolve.pretty.json
          python -m json.tool diagnostics/schedule-v17.json > diagnostics/schedule-v17.pretty.json

      - name: Commit diagnostic response
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/
          git commit -m "Verify Worker v1.7 feed [skip ci]"
          git push
