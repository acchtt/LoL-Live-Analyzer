name: Read live feed once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/read-live-feed-once.yml

permissions:
  contents: write

jobs:
  read-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Query Worker v1.7 clock sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          base="https://lol-live-analyzer-api.acchtt.workers.dev"

          curl --retry 3 --retry-delay 2 --fail-with-body -sS "$base/" \
            -o diagnostics/worker-health.json
          curl --retry 3 --retry-delay 2 --fail-with-body -sS \
            "$base/api/window?gameId=115548681803406194" \
            -D diagnostics/window-game3.headers.txt \
            -o diagnostics/window-game3.json
          curl --retry 3 --retry-delay 2 --fail-with-body -sS \
            "$base/api/chatgpt?gameId=115548681803406194" \
            -D diagnostics/chatgpt-game3.headers.txt \
            -o diagnostics/chatgpt-game3.json

          python -m json.tool diagnostics/worker-health.json > diagnostics/worker-health.pretty.json
          python -m json.tool diagnostics/window-game3.json > diagnostics/window-game3.pretty.json
          python -m json.tool diagnostics/chatgpt-game3.json > diagnostics/chatgpt-game3.pretty.json

      - name: Commit diagnostic response
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/
          git commit -m "Inspect Worker v1.7 clock source [skip ci]"
          git push
