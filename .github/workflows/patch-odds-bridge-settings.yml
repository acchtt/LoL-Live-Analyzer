name: Patch odds bridge settings panel

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-odds-bridge-settings.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Replace blocked prompt with in-page settings panel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('odds-bridge.user.js')
          source = path.read_text()
          source = source.replace('// @version      1.1.0', '// @version      1.2.0')
          source = source.replace("  let badge = null;\n", "  let badge = null;\n  let configOverlay = null;\n")
          source = source.replace("        'white-space:normal'\n", "        'white-space:normal',\n        'pointer-events:auto'\n")

          old = '''  function configureSecret() {
            const value = prompt(
              'Paste ODDS_BRIDGE_SECRET. It remains in Tampermonkey storage on this browser.',
              bridgeSecret()
            );
            if (value === null) return;
            const secret = String(value).trim();
            if (!secret) {
              GM_deleteValue(SECRET_KEY);
              setBadge('Odds bridge · secret cleared', 'idle');
              return;
            }
            GM_setValue(SECRET_KEY, secret);
            setBadge('Odds bridge ready · waiting for odds', 'waiting');
            if (lastPayload) queueSend(lastPayload, true);
          }

          function configureWorker() {
            const value = prompt('Cloudflare Worker base URL:', workerBase());
            if (value === null) return;
            const normalized = String(value).trim().replace(/\\\/+$/, '');
            if (!/^https:\\/\\//i.test(normalized)) {
              setBadge('Odds bridge · invalid Worker URL', 'error');
              return;
            }
            GM_setValue(WORKER_KEY, normalized);
            setBadge('Odds bridge · Worker URL updated', 'ok');
          }
'''

          new = '''  function closeConfigPanel() {
            configOverlay?.remove();
            configOverlay = null;
          }

          function panelButton(label, background) {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = label;
            button.style.cssText = [
              'all:initial',
              'display:inline-block',
              'box-sizing:border-box',
              'border:1px solid rgba(255,255,255,.14)',
              'border-radius:9px',
              'padding:9px 12px',
              `background:${background}`,
              'color:#fff',
              'font:600 13px/1.3 system-ui,-apple-system,Segoe UI,sans-serif',
              'cursor:pointer',
              'text-align:center'
            ].join(';');
            return button;
          }

          function openConfigPanel() {
            closeConfigPanel();
            const mount = document.body || document.documentElement;
            if (!mount) return;

            configOverlay = document.createElement('div');
            configOverlay.style.cssText = [
              'all:initial',
              'position:fixed',
              'inset:0',
              'z-index:2147483647',
              'display:flex',
              'align-items:center',
              'justify-content:center',
              'box-sizing:border-box',
              'padding:18px',
              'background:rgba(3,7,18,.80)',
              'font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif',
              'color:#e5e7eb',
              'pointer-events:auto'
            ].join(';');

            const panel = document.createElement('div');
            panel.style.cssText = [
              'all:initial',
              'display:block',
              'box-sizing:border-box',
              'width:min(520px,100%)',
              'border:1px solid #3a4761',
              'border-radius:14px',
              'padding:18px',
              'background:#111827',
              'box-shadow:0 18px 60px rgba(0,0,0,.65)',
              'font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif',
              'color:#e5e7eb',
              'pointer-events:auto'
            ].join(';');

            const title = document.createElement('div');
            title.textContent = 'Configure private odds bridge';
            title.style.cssText = 'font:700 17px/1.3 system-ui,sans-serif;color:#f8fafc;margin-bottom:6px';

            const help = document.createElement('div');
            help.textContent = 'Paste the same ODDS_BRIDGE_SECRET stored in GitHub. It stays only in Tampermonkey storage on this browser.';
            help.style.cssText = 'color:#aab4c7;margin-bottom:16px';

            const secretLabel = document.createElement('label');
            secretLabel.textContent = 'Bridge secret';
            secretLabel.style.cssText = 'display:block;margin-bottom:6px;font-weight:600;color:#dbeafe';

            const secretInput = document.createElement('input');
            secretInput.type = 'password';
            secretInput.autocomplete = 'off';
            secretInput.value = bridgeSecret();
            secretInput.placeholder = 'ODDS_BRIDGE_SECRET';

            const workerLabel = document.createElement('label');
            workerLabel.textContent = 'Cloudflare Worker URL';
            workerLabel.style.cssText = 'display:block;margin:14px 0 6px;font-weight:600;color:#dbeafe';

            const workerInput = document.createElement('input');
            workerInput.type = 'url';
            workerInput.value = workerBase();

            for (const input of [secretInput, workerInput]) {
              input.style.cssText = [
                'all:initial',
                'display:block',
                'box-sizing:border-box',
                'width:100%',
                'border:1px solid #43516d',
                'border-radius:9px',
                'padding:10px 11px',
                'background:#0b1220',
                'color:#f8fafc',
                'font:14px/1.35 system-ui,-apple-system,Segoe UI,sans-serif'
              ].join(';');
            }

            const errorBox = document.createElement('div');
            errorBox.style.cssText = 'display:none;margin-top:10px;color:#fecaca';

            const actions = document.createElement('div');
            actions.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px';
            const clearButton = panelButton('Clear secret', '#263247');
            const cancelButton = panelButton('Cancel', '#263247');
            const saveButton = panelButton('Save and connect', '#315efb');

            clearButton.addEventListener('click', () => {
              GM_deleteValue(SECRET_KEY);
              setBadge('Odds bridge · secret cleared', 'idle');
              closeConfigPanel();
            });
            cancelButton.addEventListener('click', closeConfigPanel);
            saveButton.addEventListener('click', () => {
              const secret = String(secretInput.value || '').trim();
              const worker = String(workerInput.value || '').trim().replace(/\\\/+$/, '');
              if (!secret || !/^https:\\/\\//i.test(worker)) {
                errorBox.textContent = !secret
                  ? 'Paste ODDS_BRIDGE_SECRET first.'
                  : 'Worker URL must start with https://';
                errorBox.style.display = 'block';
                return;
              }
              GM_setValue(SECRET_KEY, secret);
              GM_setValue(WORKER_KEY, worker);
              setBadge('Odds bridge ready · waiting for odds', 'waiting');
              closeConfigPanel();
              if (lastPayload) queueSend(lastPayload, true);
            });

            configOverlay.addEventListener('click', event => {
              if (event.target === configOverlay) closeConfigPanel();
            });
            panel.addEventListener('click', event => event.stopPropagation());
            actions.append(clearButton, cancelButton, saveButton);
            panel.append(title, help, secretLabel, secretInput, workerLabel, workerInput, errorBox, actions);
            configOverlay.appendChild(panel);
            mount.appendChild(configOverlay);
            setTimeout(() => secretInput.focus(), 0);
          }

          function configureSecret() {
            openConfigPanel();
          }

          function configureWorker() {
            openConfigPanel();
          }
'''

          if old not in source:
            raise SystemExit('Expected prompt configuration block was not found')
          source = source.replace(old, new)
          source = source.replace("console.info('[LoL Odds Bridge] v1.1.0 installed.", "console.info('[LoL Odds Bridge] v1.2.0 installed.")
          path.write_text(source)
          PY

          node --check odds-bridge.user.js

      - name: Commit patched userscript
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odds-bridge.user.js
          git commit -m "Fix odds bridge settings panel [skip ci]"
          git push
