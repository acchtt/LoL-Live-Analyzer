name: Repair odds bridge secret

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-odds-bridge-secret.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ODDS_BRIDGE_SECRET: ${{ secrets.ODDS_BRIDGE_SECRET }}
    steps:
      - uses: actions/checkout@v6

      - name: Repair and verify bridge secret
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p diagnostics
          present=false
          sync_status="not_attempted"
          configured=false
          health_status="unavailable"

          if [ -n "${ODDS_BRIDGE_SECRET:-}" ]; then
            present=true
            if printf '%s' "$ODDS_BRIDGE_SECRET" | npx wrangler secret put ODDS_BRIDGE_SECRET >/tmp/bridge-secret-sync.log 2>&1; then
              sync_status="success"
            else
              sync_status="failed"
            fi
          fi

          base="https://lol-live-analyzer-api.acchtt.workers.dev"
          for attempt in $(seq 1 20); do
            if curl --fail-with-body -sS "$base/?repair=$(date +%s)" -o /tmp/bridge-health.json; then
              health_status="received"
              configured=$(python - <<'PY'
          import json
          try:
              data=json.load(open('/tmp/bridge-health.json'))
              print(str(bool(data.get('bookmakerBridge',{}).get('configured'))).lower())
          except Exception:
              print('false')
          PY
              )
              [ "$configured" = "true" ] && break
            fi
            sleep 3
          done

          PRESENT="$present" SYNC_STATUS="$sync_status" CONFIGURED="$configured" HEALTH_STATUS="$health_status" python - <<'PY'
          import json, os
          from pathlib import Path
          report = {
              "repositorySecretPresent": os.environ.get("PRESENT") == "true",
              "cloudflareSyncStatus": os.environ.get("SYNC_STATUS"),
              "workerHealthStatus": os.environ.get("HEALTH_STATUS"),
              "workerBridgeConfigured": os.environ.get("CONFIGURED") == "true"
          }
          Path('diagnostics/odds-bridge-secret-repair.json').write_text(json.dumps(report, indent=2) + '\n')
          PY

      - name: Commit repair diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/odds-bridge-secret-repair.json
          git commit -m "Record odds bridge secret repair [skip ci]" || exit 0
          git push
