name: RiftPulse Reliability Tests

on:
  pull_request:
    paths:
      - index.html
      - assets/**
      - lib/**
      - tests/**
      - worker-reliable-core.js
      - worker-v2.4.js
      - package.json
      - wrangler.toml
      - .github/workflows/reliability-tests.yml
  push:
    branches:
      - main
    paths:
      - index.html
      - assets/**
      - lib/**
      - tests/**
      - worker-reliable-core.js
      - worker-v2.4.js
      - package.json
      - wrangler.toml
      - .github/workflows/reliability-tests.yml

permissions:
  contents: read

jobs:
  test:
    name: Node reliability suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check module syntax
        shell: bash
        run: |
          for file in lib/*.js worker-reliable-core.js worker-v2.4.js assets/authoritative-ui.js assets/series-game-history.js assets/schedule-integrity.js assets/schedule-shell.js assets/analysis-workspace.js assets/analysis-workspace-v2.js assets/analysis-cleanup.js assets/odds-placement.js assets/live-series-nav.js tests/*.mjs; do
            node --check "$file"
          done

      - name: Run reliability tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee reliability-test-output.txt

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reliability-test-output
          path: reliability-test-output.txt
