name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - worker-v1.4.js
      - worker-v1.5.js
      - worker-v1.6.js
      - worker-v1.7.js
      - worker-v1.8.js
      - worker-v1.9.js
      - worker-v2.0.js
      - worker-v2.1.js
      - worker-v2.2.js
      - worker-v2.3.js
      - wrangler.toml
      - .github/workflows/deploy-worker.yml

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VSGG_API_TOKEN: ${{ secrets.VSGG_API_TOKEN }}
      ODDS_BRIDGE_SECRET: ${{ secrets.ODDS_BRIDGE_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      - name: Sync VSGG token to Worker secret
        if: ${{ env.VSGG_API_TOKEN != '' }}
        shell: bash
        run: printf '%s' "$VSGG_API_TOKEN" | npx wrangler secret put VSGG_API_TOKEN

      - name: Sync private odds bridge secret
        if: ${{ env.ODDS_BRIDGE_SECRET != '' }}
        shell: bash
        run: printf '%s' "$ODDS_BRIDGE_SECRET" | npx wrangler secret put ODDS_BRIDGE_SECRET
